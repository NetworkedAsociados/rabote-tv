.izq{padding:4vh 2.2vw;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1.6vh;background:var(--panel);border-right:.3vh solid rgba(255,200,61,.5)}
.foto{height:30vh;border-radius:2vh;background:#3b2f60 center/cover;border:.4vh solid var(--oro);display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:2.4vh}
.negocio{font-size:5vh;font-weight:800;color:var(--oro);line-height:1.05}
.dato{font-size:2.5vh;color:var(--suave);display:flex;gap:1vw;align-items:center}
.codigo{margin-top:auto;background:var(--oro);color:var(--oro-osc);border-radius:2vh;padding:2vh;text-align:center}
.codigo small{display:block;font-size:2.2vh;font-weight:600}
.codigo b{display:block;font-size:6.5vh;letter-spacing:.2vw;line-height:1.1}
.codigo span{display:block;font-size:1.9vh}
.der{padding:2.5vh 2.5vw;min-height:0;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cab{display:flex;align-items:center;gap:1.5vw}
.cab img.logo{height:9vh}
.cab .tit{flex:1;min-width:0}
.cab h1{font-size:4.4vh;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab p{font-size:2.3vh;color:var(--suave)}
.reloj{font-size:6.5vh;font-weight:800;color:var(--oro);font-variant-numeric:tabular-nums}
.reloj small{display:block;font-size:1.9vh;color:var(--suave);font-weight:400;text-align:right}
.tabla{margin-top:1.8vh;display:flex;flex-direction:column;gap:.8vh;position:relative;flex:1}
.fila{display:grid;grid-template-columns:7vh 6vh 1fr 15vw 12vw;align-items:center;gap:1.2vw;background:var(--fila);border-radius:1.4vh;padding:0 1.5vw;height:6.3vh;font-size:2.8vh;transition:transform .8s ease,background .4s}
.fila .pos{font-size:3.6vh;font-weight:800;text-align:center}
.fila .art{width:5.4vh;height:5.4vh;border-radius:50%;background:#0d0820 center/contain no-repeat;border:.3vh solid rgba(255,255,255,.25)}
.fila .nom{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .mesa{color:var(--suave);font-size:2.4vh}
.fila .pts{text-align:right;font-size:3.8vh;font-weight:800;font-variant-numeric:tabular-nums}
.fila.p1{background:var(--oro);color:var(--oro-osc)}.fila.p1 .mesa{color:#6b4a0a}
.fila.p2{background:#d6d6e6;color:#22203a}.fila.p2 .mesa{color:#4a4866}
.fila.p3{background:#c9824a;color:#2b1405}.fila.p3 .mesa{color:#5a2d10}
.fila.nueva{animation:brillo 1.6s ease}
@keyframes brillo{0%{box-shadow:0 0 0 .6vh var(--verde)}100%{box-shadow:0 0 0 0 transparent}}
.pie{grid-column:1/3;background:var(--oro);color:var(--oro-osc);display:flex;align-items:center;overflow:hidden;font-size:2.8vh;font-weight:700}
.cinta{display:flex;gap:6vw;white-space:nowrap;animation:corre 28s linear infinite;padding-left:100%}
@keyframes corre{to{transform:translateX(-100%)}}
.vacio{margin:auto;text-align:center;color:var(--suave);font-size:3.4vh}
.demo{position:fixed;top:1vh;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:1.6vh;padding:.4vh 1vw;border-radius:1vh}
</style>
</head>

const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
let T=null,EDIC=null,DATOS={};
function txt(v){return (v==null?"":String(v));}
function ponerNegocio(t){
  $("negocio").textContent=txt(t.neg)||txt(t.b)||"RABOTE";
  $("dir").textContent=[txt(t.dir),txt(t.b)].filter(Boolean).join(" · ")||"";
  $("horario").textContent=txt(t.hor);
  $("redes").textContent=txt(t.red);
  $("codigo").textContent=txt(t.cd)||COD;
  $("torneo").textContent=txt(t.n);
  $("reglas").textContent=({tejo:"Tejo",rana:"Rana",bolirana:"Bolirana"}[t.j]||"")+" · "+txt(t.tir)+" tiros por intento · gana el de más puntos";
  $("cinta").innerHTML=(["🏆 Premio del local: "+txt(t.pre),"🎯 Juega gratis: descarga RABOTE en Play Store","🇨🇴 Tejo, Rana y Bolirana en tu celular"]).concat(["🏆 Premio del local: "+txt(t.pre),"🎯 Juega gratis: descarga RABOTE en Play Store","🇨🇴 Tejo, Rana y Bolirana en tu celular"]).map(x=>"<span>"+x+"</span>").join("");
}
function pintarTabla(lista,nuevo){
  const top=lista.slice(0,10);
  if(!top.length){$("tabla").innerHTML='<div class="vacio">Esperando el primer intento…<br><small>Juega desde RABOTE → Torneos → Locales</small></div>';return;}
  $("tabla").innerHTML=top.map((j,i)=>
    '<div class="fila '+(i<3?"p"+(i+1):"")+' '+(j.uid===nuevo?"nueva":"")+'"><div class="pos">'+(i+1)+'</div><div class="art" style="background-image:url('+ART+')"></div><div class="nom">'+esc(j.n)+'</div><div class="mesa">'+esc(j.m)+'</div><div class="pts">'+esc(j.p)+'</div></div>').join("");
}
function esc(v){return txt(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function vaciar(msg){
  T=null;
  const datos={negocio:"RABOTE Play",dir:"Torneos de local en bares y tiendas",horario:"",redes:"@johnhansensp",codigo:"",torneo:"Torneos de local",reglas:"Tejo · Rana · Bolirana en tu celular",reloj:"",estado:""};
  Object.keys(datos).forEach(id=>$(id).textContent=datos[id]);
  $("cinta").innerHTML=["🎯 Juega gratis: descarga RABOTE en Play Store","🇨🇴 Tejo, Rana y Bolirana en tu celular"].concat(["🎯 Juega gratis: descarga RABOTE en Play Store","🇨🇴 Tejo, Rana y Bolirana en tu celular"]).map(x=>"<span>"+x+"</span>").join("");
  $("tabla").innerHTML='<div class="vacio">'+esc(msg)+'<br><small>Juega desde RABOTE → Torneos → Locales</small></div>';
}
async function cargar(){
  if(!COD){vaciar("Falta el código del torneo en el enlace");return;}
  try{
    const t=await (await fetch(DB+"/locales/"+COD+".json")).json();
    if(!t){vaciar("No hay ningún torneo con el código "+COD);return;}
    T=t;EDIC=String(t.ini);ponerNegocio(t);
    const tb=await (await fetch(DB+"/locales_tabla/"+COD+"/"+EDIC+".json")).json()||{};
    const lista=Object.keys(tb).map(k=>Object.assign({uid:k},tb[k])).filter(x=>x.p>=0).sort((a,b)=>b.p-a.p||a.t-b.t);
    const antes=DATOS;DATOS={};lista.forEach(x=>DATOS[x.uid]=x.p);
    let nuevo=null;lista.forEach(x=>{if(antes[x.uid]!==undefined&&antes[x.uid]!==x.p)nuevo=x.uid;});
    pintarTabla(lista,nuevo);
    $("estado").textContent=estado();
  }catch(e){$("estado").textContent="sin conexión, reintentando…";}
}
function estado(){
  const a=Date.now(), ini=Number(T.ini), fin=Number(T.fin);
  if(a<ini)return "empieza en "+fmt(Math.floor((ini-a)/1000));
  if(a<=fin)return "para terminar";
  return "¡torneo terminado!";
}
function reloj(){
  if(!T){return;}
  const a=Date.now(),fin=Number(T.fin);
  const s=Math.max(0,Math.floor((fin-a)/1000));
  $("reloj").textContent=fmt(s);
  $("estado").textContent=estado();
}
if(DEMO){
  T={n:"Copa de los Viernes",neg:"Bar El Rincón",b:"Kennedy",dir:"Calle 38 Sur # 78-12",hor:"Jue a Sáb · 6 p. m. a 2 a. m.",red:"@barelrincon",cd:"ViernesBAR",j:"tejo",tir:20,pre:"Una cerveza gratis",ini:0,fin:Date.now()+(2*3600+14*60+5)*1000};
  ponerNegocio(T);
  let jug=[["Pipe_Tejo","Mesa 1",186],["ChuchoR","Mesa 4",171],["LaMona","Barra",158],["Dani_77","Mesa 2",140],["Ferchito","Mesa 3",122],["Sofi_R","Mesa 6",115],["ElMono","Barra",98],["Caro","Mesa 5",90],["Juancho","Mesa 2",84],["Valen","Mesa 1",77]].map((x,i)=>({uid:"d"+i,n:x[0],m:x[1],p:x[2]}));
  const pint=(n)=>{jug.sort((a,b)=>b.p-a.p);pintarTabla(jug,n);};
  pint();
  setInterval(()=>{const k=Math.floor(Math.random()*jug.length);jug[k].p+=Math.floor(5+Math.random()*40);pint(jug[k].uid);},6000);
}else{
  cargar();setInterval(cargar,5000);
}
